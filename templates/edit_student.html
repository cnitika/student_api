{% extends "base.html" %}

{% block title %}Edit Student - Student Marks Management System{% endblock %}
{% block page_heading %}Edit Student: {{ student.student_name }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 750px; margin: 0 auto;">
    <div class="card-header">
        <h2 class="card-title">Update Student Information</h2>
        <a href="{{ url_for('web.students_list') }}" class="btn btn-secondary btn-sm">Back to List</a>
    </div>

    <form action="{{ url_for('web.edit_student_page', student_id=student.id) }}" method="POST">
        <div class="form-row">
            <div class="form-group">
                <label for="roll_no" class="form-label">Roll Number *</label>
                <input type="text" id="roll_no" name="roll_no" value="{{ form_data.roll_no or student.roll_no }}" class="form-input" required>
            </div>
            <div class="form-group">
                <label for="student_name" class="form-label">Full Name *</label>
                <input type="text" id="student_name" name="student_name" value="{{ form_data.student_name or student.student_name }}" class="form-input" required>
            </div>
        </div>

        <div class="form-group">
            <label for="email" class="form-label">Institutional Email *</label>
            <input type="email" id="email" name="email" value="{{ form_data.email or student.email }}" class="form-input" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="department" class="form-label">Department *</label>
                <input type="text" id="department" name="department" value="{{ form_data.department or student.department }}" class="form-input" required>
            </div>
            <div class="form-group">
                <label for="course" class="form-label">Course Degree *</label>
                <input type="text" id="course" name="course" value="{{ form_data.course or student.course }}" class="form-input" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="academic_year" class="form-label">Academic Year *</label>
                <input type="text" id="academic_year" name="academic_year" value="{{ form_data.academic_year or student.academic_year }}" class="form-input" required>
            </div>
            <div class="form-group">
                <label for="semester" class="form-label">Current Semester (1-12) *</label>
                <input type="number" id="semester" name="semester" min="1" max="12" value="{{ form_data.semester or student.semester }}" class="form-input" required>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Update Student</button>
            <a href="{{ url_for('web.students_list') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
