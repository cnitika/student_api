{% extends "base.html" %}

{% block title %}Edit Subject - Student Marks Management System{% endblock %}
{% block page_heading %}Edit Subject: {{ subject.subject_code }}{% endblock %}

{% block content %}
<div class="card" style="max-width: 550px; margin: 0 auto;">
    <div class="card-header">
        <h2 class="card-title">Update Subject Information</h2>
        <a href="{{ url_for('web.subjects_list') }}" class="btn btn-secondary btn-sm">Back to Subjects</a>
    </div>

    <form action="{{ url_for('web.edit_subject_page', subject_id=subject.id) }}" method="POST">
        <div class="form-group">
            <label for="subject_code" class="form-label">Subject Code *</label>
            <input type="text" id="subject_code" name="subject_code" value="{{ form_data.subject_code or subject.subject_code }}" class="form-input" required>
        </div>
        <div class="form-group">
            <label for="subject_name" class="form-label">Subject Name *</label>
            <input type="text" id="subject_name" name="subject_name" value="{{ form_data.subject_name or subject.subject_name }}" class="form-input" required>
        </div>
        <div class="form-group">
            <label for="max_marks" class="form-label">Maximum Marks *</label>
            <input type="number" step="0.01" id="max_marks" name="max_marks" value="{{ form_data.max_marks or subject.max_marks }}" class="form-input" required min="1">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Update Subject</button>
            <a href="{{ url_for('web.subjects_list') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
