{% extends "base.html" %}

{% block title %}Register New Student - Student Marks Management System{% endblock %}
{% block page_heading %}Register New Student{% endblock %}

{% block content %}
<div class="card" style="max-width: 750px; margin: 0 auto;">
    <div class="card-header">
        <h2 class="card-title">Student Information</h2>
        <a href="{{ url_for('web.students_list') }}" class="btn btn-secondary btn-sm">Back to List</a>
    </div>

    <form action="{{ url_for('web.add_student_page') }}" method="POST">
        <div class="form-row">
            <div class="form-group">
                <label for="roll_no" class="form-label">Roll Number *</label>
                <input type="text" id="roll_no" name="roll_no" value="{{ form_data.roll_no or '' }}" class="form-input" required placeholder="e.g. CS2025001">
            </div>
            <div class="form-group">
                <label for="student_name" class="form-label">Full Name *</label>
                <input type="text" id="student_name" name="student_name" value="{{ form_data.student_name or '' }}" class="form-input" required placeholder="e.g. Rahul Sharma">
            </div>
        </div>

        <div class="form-group">
            <label for="email" class="form-label">Institutional Email *</label>
            <input type="email" id="email" name="email" value="{{ form_data.email or '' }}" class="form-input" required placeholder="e.g. rahul.sharma@college.edu">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="department" class="form-label">Department *</label>
                <input type="text" id="department" name="department" value="{{ form_data.department or '' }}" class="form-input" required placeholder="e.g. Computer Science">
            </div>
            <div class="form-group">
                <label for="course" class="form-label">Course Degree *</label>
                <input type="text" id="course" name="course" value="{{ form_data.course or '' }}" class="form-input" required placeholder="e.g. B.Tech CSE">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="academic_year" class="form-label">Academic Year *</label>
                <input type="text" id="academic_year" name="academic_year" value="{{ form_data.academic_year or '2025-2026' }}" class="form-input" required placeholder="e.g. 2025-2026">
            </div>
            <div class="form-group">
                <label for="semester" class="form-label">Current Semester (1-12) *</label>
                <input type="number" id="semester" name="semester" min="1" max="12" value="{{ form_data.semester or 1 }}" class="form-input" required>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Student</button>
            <a href="{{ url_for('web.students_list') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
